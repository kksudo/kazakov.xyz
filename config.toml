baseurl = "https://scottschlangen.com"
title = "Scott Schlangen"
theme = "hugo-coder-forked"
languagecode = "en"
defaultcontentlanguage = "en"

paginate = 20

pygmentsstyle = "bw"
pygmentscodefences = true
pygmentscodefencesguesssyntax = true

enableGitInfo = true
enableRobotsTXT = true

[markup.goldmark.renderer]
unsafe = true

# Hugo settings
[sitemap]
changefreq = 'weekly'
filename = 'sitemap.xml'
priority = 0.5

[params]
author = "Scott Schlangen"
info = ["Senior Security Engineer", "Detection · Vulnerability Management · Incident Response"]
description = "Scott Schlangen — security engineer focused on detection engineering, vulnerability management, incident response, and the automation that keeps security programs running."
keywords = "cybersecurity,security engineer,detection engineering,incident response,vulnerability management,identity management,compliance,infosec,soc,municipal security,MSSP"
avatarURL = "img/scott-headshot.png"

faviconSVG = "/img/favicon.svg"
favicon_32 = "/img/favicon.png"

since = 2012
enableTwemoji = false
colorScheme = "dark"
hidecolorschemetoggle = false
powered_by = false
maxSeeAlsoItems = 5
customSCSS = ["scss/custom.scss"]
customJS = ["js/portfolio.js"]

[taxonomies]
#tag = "tags"
#author = "authors"

