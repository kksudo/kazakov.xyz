name: Build and Publish to Cloudflare Pages

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'release/*'

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.152.2
    name: Publish to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build
        run: hugo build --minify --gc

      # cloudflare/pages-action is gone (the repository 404s); Cloudflare
      # folded Pages deployments into wrangler-action.
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: >-
            pages deploy ./public
            --project-name=kazakov-xyz
            --branch=${{ github.head_ref || github.ref_name }}
