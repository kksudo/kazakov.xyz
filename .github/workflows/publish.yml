name: Build and Publish to Cloudflare Pages

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'release/*'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.117.0
    name: Build site
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Build
        run: hugo --minify --gc

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hugo-public
          path: public
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    name: Publish to Cloudflare Pages
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: hugo-public
          path: public

      - name: Check Cloudflare secrets
        id: cf
        run: |
          if [ -z "${{ secrets.CF_API_TOKEN }}" ] || [ -z "${{ secrets.CF_ACCOUNT_ID }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Missing CF_API_TOKEN or CF_ACCOUNT_ID repository secrets. Add them under GitHub → Settings → Secrets and variables → Actions, then re-run this workflow."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Cloudflare Pages
        if: steps.cf.outputs.ready == 'true'
        uses: cloudflare/pages-action@v1
        with:
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          apiToken: ${{ secrets.CF_API_TOKEN }}
          directory: ./public
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          projectName: scottschlangen-com
          wranglerVersion: '3'

      - name: Fail when deploy secrets are missing
        if: steps.cf.outputs.ready != 'true'
        run: exit 1
